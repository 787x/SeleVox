name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 Release / offline tests / publish
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24 LTS for documentation checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked documentation tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Markdown link checker regression tests
        run: npm run test:docs
      - name: Offline Markdown links (all tracked documents)
        run: ./scripts/Test-DocsLinks.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SeleVox.slnx
      - name: Build Release x64
        run: dotnet build SeleVox.slnx -c Release --no-restore
      - name: Offline tests and counts
        run: ./scripts/Test-CI.ps1
      - name: Upload test reports (including failures)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/ci/**/*.trx
          if-no-files-found: warn
          retention-days: 7
      - name: Publish self-contained and verify integrity
        run: ./scripts/Publish-Windows.ps1 -VersionTag v0.0.0-rc.1
      - name: Portable ZIP extraction, versions, hashes and rejection checks (no release)
        run: |
          ./scripts/Test-Packaging.ps1 -VersionTag v0.0.0-rc.1
          ./scripts/Test-ReleasePublishing.ps1
      - name: Upload validated portable ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SeleVox-portable-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows portable directory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SeleVox-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 7
